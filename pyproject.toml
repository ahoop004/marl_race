[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marl_racex"
version = "0.1.0"
description = "Reinforcement learning experiments for racing"
authors = [{ name = "F110_MARL contributors" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "pyglet",
    "pillow",
    "pyyaml",
    "numba",
    "pandas",
    "scipy",
    "tensorboard",
    "wandb>=0.22.3",
    "rich"
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.1.1,<2",
    "pettingzoo>=1.25.0,<2",
]
analysis = [
    "matplotlib",
    "jupyterlab",
    "ipykernel",
    "nbclient",
    "ipywidgets",
    "ipympl",
]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
