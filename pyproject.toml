[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-race"
version = "0.1.0"
description = "Reinforcement learning experiments for racing"
authors = [{ name = "Aaron Hooper" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3,<2.6",
    "torch>=2.14.1,<2.15",
    "torchrl>=0.14.1,<0.15",
    "tensordict>=0.14.3,<0.15",
    "pyglet>=2.1.16,<3",
    "pillow>=12.3.0,<13",
    "pyyaml",
    "hydra-core>=1.3.7,<1.4",
    "omegaconf>=2.3.1,<2.4",
    "numba>=0.68.0,<0.69",
    "pandas>=3.0.6,<4",
    "scipy>=1.18.1,<2",
    "tensorboard>=2.21.0,<3",
    "wandb>=0.30.0,<0.31",
    "rich"
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.11.2,<4",
    "jupyterlab",
    "ipykernel",
    "nbclient",
    "ipywidgets",
    "ipympl",
]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Do not load unrelated plugins from the shared WSL Python installation.
addopts = "--disable-plugin-autoload"
pythonpath = ["src"]
testpaths = ["tests"]
