[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-race"
version = "0.1.0"
description = "Reinforcement learning experiments for racing"
authors = [{ name = "Aaron Hooper" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "torch==2.14.1",
    "torchrl==0.14.1",
    "tensordict==0.14.3",
    "pyglet==2.1.16",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "numba==0.68.0",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "tensorboard==2.21.0",
    "wandb==0.30.0",
    "rich==15.0.0"
]

[project.optional-dependencies]
analysis = [
    "matplotlib==3.11.2",
    "jupyterlab==4.6.4",
    "ipykernel==6.29.5",
    "nbclient==0.11.0",
    "ipywidgets==8.1.9",
    "ipympl==0.10.0",
]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Do not load unrelated plugins from the shared WSL Python installation.
addopts = "--disable-plugin-autoload"
pythonpath = ["src"]
testpaths = ["tests"]
