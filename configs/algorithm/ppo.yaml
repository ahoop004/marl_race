name: ppo
backend: torchrl
loss: clip_ppo
optimizer: adam
advantage_estimator: gae
critic_loss: l2
observation_extension: null
critic_input: local_observation
critic_sharing: independent
transfer_scope: actor_and_critic
params:
  progress_unit: environment_steps
  update_version: torchrl-ppo-v1
  n_steps: 409600
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  batch_size: 1024
  learning_rate: 0.001
  gamma: 0.99
  lr_schedule: linear
  learning_rate_end: 0.0001
  log_std_init: 0.0
  target_kl: null
