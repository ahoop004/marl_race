task:
  name: lap_completion_normalized_progress
  description: One-lap completion using signed normalized Frenet progress.
reward:
  progress_delta_bonus:
    enabled: true
    weight: 1.0
    units: lap_fraction
    positive_only: false
    max_delta: 0.025
    boundary_penalty: -0.05
    collision_penalty: -2.0
  timeout_penalty:
    enabled: true
    penalty: -1.0
  lap_completion:
    enabled: true
    bonus: 2.0
    require_clean: true
  step_time_penalty:
    enabled: true
    per_second: -0.00025
    apply_on_terminal: true
