# @package _global_
# Shared training setup for historical PPO and the completion comparison scenarios.
experiment:
  total_steps: 120000000
  seed: 42
  parallel_envs: 64
  envs_per_worker: 8
  measure_collector_startup: true
environment:
  max_steps: 80000
algorithm:
  params:
    frames_per_batch: 4096
    n_steps: 409600
    n_epochs: 10
    batch_size: 1024
    learning_rate: 0.001
    lr_schedule: linear
    learning_rate_end: 0.0001
    log_std_init: 0.0
    target_kl: null
execution:
  params:
    device: cuda
    collection_device: cpu
checkpoint:
  every_steps: 1024000
