includes: [common.yaml]

# TorchRL MAPPO defaults for the cooperative 2v2 completion task.
# Agent params override training_defaults.
experiment:
  mappo_backend: torchrl

mappo:
  actor_mode: independent
  reward_mode: team_shared
  critic_mode: shared_team
  team_reward_reduction: mean

training_defaults:
  # Track the new loss/advantage implementation in resolved-config provenance.
  update_version: torchrl-mappo-batch512-v1
  progress_unit: environment_steps
  team_return_mode: joint

  # Rollout collection
  n_steps: 2048          # joint race decisions per serial update
  action_repeat: 1

  # PPO hyperparameters
  batch_size: 512

  # Network architecture
  hidden_dims: [256, 256]
  activation: tanh
