# Actor-only adaptation; load the same LiDAR-enabled PPO source as full tuning.
# All hidden linear layers receive residuals. Base weights, biases and head freeze.
# Include after the completion scenario; select the source with --pretrained-actor.
experiment:
  mappo_backend: torchrl
mappo:
  actor_mode: shared
training_defaults:
  require_pretrained_actor: true
  lora:
    mode: per_agent
    rank: 4
    alpha: 4.0  # residual multiplier alpha/rank = 1
    train_log_std: true
    per_agent_log_std: true  # separate exploration vectors for each learner
