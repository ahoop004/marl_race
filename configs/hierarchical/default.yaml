defaults:
- bank@bank
- _self_
enabled: true
interval: 5
gamma: ${algorithm.params.gamma}
composition:
  distribution: categorical
  sampled_action: categorical
  coefficient_constraint: hard_selection
  backend: categorical_bank
  entropy_convention: categorical_exact
  coefficient_bound: 1.0
  initial_concentration: 0.3
  initial_mean: null
  initial_std: null
  temperature: 1.0
  inference_strategy: representative
  inference_samples: 32
  inference_top_k: null
  inference_temperature: null
dwell_time_scale_seconds: 1.0
preview:
  enabled: false
  samples: 20
  spacing_m: 0.6
  curvature_scale: 1.0
  width_scale: 1.0
selector:
  type: learned
  skill: 0
  anticipation: 1.0
  fallback: 0
  sequence: [0, 1]
record_trajectory: false
