# @package _global_
defaults:
- /config
- /wandb
- /training: historical_ppo
- override /algorithm: ppo
- override /scenario: solo_lap_completion
- override /adaptation: ppo_lora
- override /maps: generated
- override /evaluation: solo_transfer
- override /execution: single_node_gpu
- override /reward: generated_one_lap
- _self_
experiment:
  name: ppo_generated_lora_1lap
  total_steps: null
  episodes: 30000
launch:
  type: independent
  work_items:
    straight: [maps=generated_straight]
    sweeper: [maps=generated_sweeper]
    hairpin: [maps=generated_hairpin]
    chicane: [maps=generated_chicane]
    s_curve: [maps=generated_s_curve]
wandb:
  logging:
    groups:
      reward_components: true
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: ppo-generated-one-lap
  job_type: lora
  tags:
  - ppo
  - torchrl
  - single-agent
  - lap-completion
  - generated-maps
  - lora
  notes: Independent family adapter; frozen PPO base, trainable local critic, scenario episode budget, distance rewards, one failure penalty, no evaluation runs.
  mode: online
paths:
  pretrained_checkpoint: ${paths.project_root}/pretrained_models/mlp_base_ppo_seed42_best.pt
environment:
  max_steps: 8000
  target_laps: 1
  track_limits:
    enabled: true
    terminate: true
  terminate_on_collision: false
algorithm:
  params:
    # The launcher selects a CPU-appropriate collector that divides these batches.
    frames_per_batch: 6144
    n_steps: 67584
    n_epochs: 5
    batch_size: 1024
    learning_rate: 0.0001
    lr_schedule: constant
    learning_rate_end: null

checkpoint:
  every_steps: null
  every_updates: 1

evaluation:
  enabled: false
