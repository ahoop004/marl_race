# @package _global_
defaults:
- /config
- /training: historical_ppo
- override /algorithm: ppo
- override /scenario: solo_lap_completion
- override /adaptation: ppo_lora
- override /maps: generated
- override /evaluation: solo_transfer
- override /execution: ppo_transfer
- override /reward: generated_one_lap
- _self_
experiment:
  name: ppo_generated_lora_1lap_20k
  total_steps: null
  episodes: 20000
  parallel_envs: 24
  envs_per_worker: 4
wandb:
  logging:
    profile: auto
    groups:
      train: true
      eval: true
      performance: true
      reward_components: true
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: ppo-generated-one-lap
  job_type: lora
  tags:
  - ppo
  - torchrl
  - single-agent
  - lap-completion
  - generated-maps
  - lora
  notes: Independent family adapter; frozen PPO base, trainable local critic, 20000 one-lap training episodes, distance rewards, one failure penalty, no evaluation runs.
  mode: online
paths:
  pretrained_checkpoint: ${paths.project_root}/pretrained_models/mlp_base_ppo_seed42_best.pt
environment:
  max_steps: 20000
  target_laps: 1
  no_progress:
    timeout_s: 60.0
    min_progress_m: 1.0
  track_limits:
    enabled: true
    terminate: true
  terminate_on_collision: false
algorithm:
  params:
    # Exact multiples of 96 slots and 1024-sample minibatches: no rounding.
    frames_per_batch: 6144
    n_steps: 67584
    n_epochs: 5
    batch_size: 1024
    learning_rate: 0.0001
    lr_schedule: constant
    learning_rate_end: null

checkpoint:
  every_steps: null
  every_updates: 1

evaluation:
  enabled: false
