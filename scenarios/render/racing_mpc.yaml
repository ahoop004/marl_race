# @package _global_
defaults:
- /vehicle: combined_slip
- /controllers: racing_mpc
- _self_
experiment:
  name: render_racing_mpc_solo
  episodes: 2
  seed: 10043
  torch_threads: 1
environment:
  timestep: 0.05
  lidar_beams: 108
  lidar_range: 10.0
  render: true
  centerline_autoload: true
  walls_autoload: true
  track_preview:
    points: 20
    spacing: 0.3
  episode_termination:
    mode: all_agents
    lap_completion: true
  terminal_agents:
    remain_collidable: true
    crashed_behavior: stationary
    finished_behavior: coast_then_stop
    finish_clearance_steps: 40
  map_bundles:
  - circle_map
  - Budapest_map
  map_bundles_train:
  - circle_map
  - Budapest_map
  map_bundles_eval:
  - circle_map
  - Budapest_map
  map_cycle: per_episode
  map_pick: round_robin
  action_repeat: 1
  centerline_features: true
  centerline_render: true
  target_laps: 3
  max_steps: 16000
  lap_counting:
    require_finish_line: true
    count_initial_crossing_as_lap: false
  random_spawn:
    enabled: true
    allow_reuse: false
  terminate_on_collision: true
  friction:
    version: 1
    scope: shared
    train:
      mode: fixed
      mu: 1.0489
    eval:
      mode: fixed
      mu: 1.0489
  rendering:
    vehicle_colors:
      car_0: '#3288ff'
agents:
  car_0:
    algorithm: racing_mpc
    trainable: false
    action_adapter: rolling_speed_to_wheel_v1
    params: ${controllers.racing_mpc}
paths:
  project_root: ???
  output_root: ${paths.project_root}/outputs
hydra:
  job:
    chdir: false
wandb:
  enabled: false
