# Production PPO pretraining sweep: N3-G2 (3 nodes x 2 GPUs, 24 CPUs/node).
# Six independent single-GPU PPO trials, 8 collector processes x 8 envs/trial.
# Use with scripts/hpc/ray_tune_matrix.sbatch on the public gpu partition.
name: PPO lap-completion pretraining N3-G2 24M
experiment_id: ppo-pretrain-n3g2-24m-v1
algorithm: ppo
scenario: scenarios/ppo_lap_completion_pretrain.yaml

# Exactly 60 historical PPO updates (409,600 samples/update); approximately 24M.
total_steps: 24576000
seeds: [42, 43]
sweep_seed: 2026
search:
  method: grid
  parameters:
    algorithm.params.learning_rate:
      type: choice
      values: [0.0003, 0.0006, 0.001]

# N3-G2 validated resource profile: 2 Ray PPO trials per 24-CPU/2-GPU node.
max_concurrent_trials: 6
resources_per_trial: {cpu: 10, gpu: 1}
fixed_overrides:
  - experiment.parallel_envs=8
  - experiment.envs_per_worker=8
  - algorithm.params.n_steps=409600
  - algorithm.params.frames_per_batch=4096
  - algorithm.params.batch_size=1024
  - algorithm.params.n_epochs=10

# Lap-completion checkpoint selection on circle_map, held-out evaluation seeds.
# 2,048,000 = every five full PPO updates; 20 races per evaluation.
evaluation:
  seed: 10042
  episodes: 20
  every_steps: 2048000
  max_steps: 8000

wandb:
  mode: online
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  group: ppo-pretrain-n3g2-24m-v1
