# Two architectures x three adaptation arms x MAPPO seed 42 = six trials.
# Prepare immutable PPO seed-42 sources with scripts/prepare_mappo_pilot_sources.py.
name: Phase 6 MAPPO adaptation pilot
experiment_id: phase6-mappo-pilot-v1
algorithm: mappo
scenario: scenarios/mappo_2v2_completion_scratch.yaml
total_steps: 4096000
seeds: [42]
sweep_seed: 2026
source_manifest: outputs/pretrained_sources/phase6-mappo-pilot-v1/manifest.yaml
pretraining_seeds: [42]
search:
  method: grid
  parameters:
    network:
      type: choice
      values: [mlp_base, cnn1d_base]
    adaptation:
      type: choice
      values: [scratch, full_finetune, lora]
fixed_overrides:
  - environment.lidar_beams=1080
  - experiment.parallel_envs=8
  - experiment.envs_per_worker=8
# Rank 4, alpha 4, per-agent adapters/exploration come from adaptation=lora.
max_concurrent_trials: 2
resources_per_trial: {cpu: 10, gpu: 1}
evaluation: {seed: 10042, episodes: 10, every_steps: 1024000, max_steps: 8000}
wandb: {mode: online, project: marl-f110-complete, group: phase6-mappo-pilot-v1}
